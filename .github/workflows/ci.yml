name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt ruff mypy

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy trackora database services tracker ui --explicit-package-bases --ignore-missing-imports

      - name: Run tests
        run: python -m pytest --tb=short --cov=trackora --cov=database --cov=services --cov=tracker --cov-report=term-missing

  build:
    name: Build executable
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller Trackora.spec

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: installer/Trackora.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trackora-Installer
          path: installer/Output/*.exe

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: Trackora-Installer
          path: installer/Output/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Trackora ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            installer/Output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
